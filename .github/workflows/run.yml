name: Solana Whale Tracker

on:
  schedule:
    - cron: '*/15 * * * *'       # 每15分钟
  workflow_dispatch:              # 手动触发
    inputs:
      test_msg:
        description: '发送测试Telegram消息'
        type: boolean
        default: false

permissions:
  contents: write                 # git push 权限

concurrency:
  group: solana-whale-tracker
  cancel-in-progress: false       # 不取消正在跑的，避免状态冲突

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: bash run.sh

      - name: Test Telegram (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_msg }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import json, urllib.request
          data = json.dumps({
              'chat_id': '${{ secrets.TELEGRAM_CHAT_ID }}',
              'text': '🧪 Solana Whale Tracker 测试消息 — Telegram配置正确!'
          }).encode()
          req = urllib.request.Request(
              'https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage',
              data=data, headers={'Content-Type': 'application/json'}
          )
          urllib.request.urlopen(req, timeout=10)
          print('测试消息已发送')
          "
